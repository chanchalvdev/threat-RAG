services:
  qdrant:
    image: qdrant/qdrant:v1.13.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The qdrant image ships without curl; bash's /dev/tcp probes the port instead
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: threatrag
      POSTGRES_USER: threatrag
      POSTGRES_PASSWORD: threatrag
    ports:
      - "5435:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threatrag"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"  # host 6380: avoids clashing with a locally installed Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../backend/.env
    environment:  # inside the compose network the services are reached by name
      QDRANT_URL: http://qdrant:6333
      # A native Ollama (faster on macOS) is reachable as STACK_OLLAMA_URL=http://host.docker.internal:11434
      OLLAMA_URL: ${STACK_OLLAMA_URL:-http://ollama:11434}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://threatrag:threatrag@postgres:5432/threatrag
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # python:3.13-slim has no curl
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Daily ATT&CK / KEV / TAXII refresh with the backend image. Opt in:
  #   docker compose --profile feeds up -d scheduler
  scheduler:
    profiles: ["feeds"]
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.scripts.refresh_feeds", "--every", "24h"]
    env_file:
      - ../backend/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: ${STACK_OLLAMA_URL:-http://ollama:11434}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://threatrag:threatrag@postgres:5432/threatrag
    volumes:
      - mitre_cache:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../web
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mitre_cache:
  qdrant_storage:
  pg_data:
  ollama_data:
