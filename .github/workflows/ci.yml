name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: threatrag/backend
    env:
      KIMCHI_API_KEY: test-key-for-unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            threatrag/backend/requirements.txt
            threatrag/backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app/
      - run: mypy app/
      - run: pytest tests/unit --cov=app --cov-fail-under=80
      # Offline: pattern guard against the injection suite. Fails if a rule change lets attacks
      # through or starts blocking legitimate security questions (thresholds live in the unit tests).
      - run: python -m app.scripts.run_guard_eval

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: threatrag/backend
    services:
      qdrant:
        image: qdrant/qdrant:v1.13.0
        ports: ["6333:6333"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: threatrag
          POSTGRES_USER: threatrag
          POSTGRES_PASSWORD: threatrag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U threatrag" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KIMCHI_API_KEY: test-key-for-unit-tests
      QDRANT_URL: http://localhost:6333
      DATABASE_URL: postgresql://threatrag:threatrag@localhost:5432/threatrag
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            threatrag/backend/requirements.txt
            threatrag/backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Real Qdrant, Redis and Postgres; embeddings are a deterministic fake, so no model server.
      - run: pytest tests/integration -m integration

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: threatrag/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: threatrag/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  images:
    runs-on: ubuntu-latest
    needs: [backend, integration, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t threatrag-backend:ci threatrag/backend
      - run: docker build -t threatrag-web:ci threatrag/web
      - name: Trivy scan (backend)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.0
          image --exit-code 1 --severity CRITICAL --ignore-unfixed threatrag-backend:ci
